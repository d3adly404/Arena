<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <meta name="description" content="BedTrack — a simple mobile web app for tracking hospital beds, patients and simulated emergency scenarios.">
  <title>BedTrack — Hospital Bed &amp; Emergency Tracker</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛏️</text></svg>">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Top bar -->
  <header class="topbar">
    <div class="brand">
      <div class="logo">🛏️</div>
      <div>
        <h1>BedTrack</h1>
        <p>Hospital bed &amp; emergency simulator</p>
      </div>
    </div>
    <div class="top-right">
      <div class="clock" id="clock">--:--</div>
      <div class="occ-pill ok" id="occPill">--%</div>
    </div>
  </header>

  <!-- Alerts -->
  <div id="alertBar"></div>

  <!-- Pages -->
  <main>
    <section class="page active" id="page-dashboard"></section>
    <section class="page" id="page-beds"></section>
    <section class="page" id="page-emergencies"></section>
    <section class="page" id="page-simulate"></section>
  </main>

  <!-- Bottom navigation -->
  <nav class="bottomnav">
    <button class="nav-btn on" data-tab="dashboard"><span class="nav-ic">📊</span>Dashboard</button>
    <button class="nav-btn" data-tab="beds"><span class="nav-ic">🛏️</span>Beds</button>
    <button class="nav-btn" data-tab="emergencies"><span class="nav-ic">🚨</span>Emergencies</button>
    <button class="nav-btn" data-tab="simulate"><span class="nav-ic">🧪</span>Simulate</button>
  </nav>

  <!-- Modals -->
  <div class="modal-backdrop" id="backdrop"></div>
  <div class="sheet" id="bedSheet"></div>
  <div class="sheet" id="formSheet"></div>

  <!-- Toasts -->
  <div class="toasts" id="toasts"></div>

  <script src="js/scenarios.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
